name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # the pnpm version comes from the `packageManager` field in package.json
      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint and type check
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test --project unit

      - name: Build
        run: pnpm run build

      # the Storybook play functions run in Chromium through Vitest browser mode
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Storybook tests
        run: pnpm run test-storybook
